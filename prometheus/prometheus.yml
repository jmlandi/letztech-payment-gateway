global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: app
    metrics_path: /metrics
    static_configs:
      - targets: ["app:3000"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  # cadvisor job disabled along with the service in docker-compose.yml --
  # see that file's comment for why. Re-add if a future host proves more
  # compatible.
  # - job_name: cadvisor
  #   static_configs:
  #     - targets: ["cadvisor:8080"]
