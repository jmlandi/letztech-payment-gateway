<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>LetzTech · Review de Risco</title>
  <style>
    :root {
      --bg: #0f1115; --panel: #191c23; --border: #2a2f3a; --text: #e7e9ee;
      --muted: #9aa2b1; --accent: #5b8cff; --ok: #2ecc71; --warn: #f1c40f; --bad: #ff5c5c;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text); }
    header { padding: 16px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg); z-index: 5; }
    h1 { font-size: 18px; margin: 0 0 2px; }
    .sub { color: var(--muted); font-size: 13px; }
    main { padding: 16px; max-width: 900px; margin: 0 auto; }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 14px; }
    label { display: block; font-size: 12px; color: var(--muted); margin: 8px 0 4px; }
    input, select, button { width: 100%; padding: 10px 12px; border-radius: 9px; border: 1px solid var(--border);
      background: #12151b; color: var(--text); font-size: 15px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    button { background: var(--accent); border: none; color: #fff; font-weight: 600; margin-top: 12px; cursor: pointer; }
    button.secondary { background: transparent; border: 1px solid var(--border); color: var(--muted); }
    .eval { border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
    .eval .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; text-transform: uppercase; letter-spacing: .04em; }
    .badge.approved { background: rgba(46,204,113,.15); color: var(--ok); }
    .badge.denied { background: rgba(255,92,92,.15); color: var(--bad); }
    .badge.received, .badge.pending { background: rgba(241,196,15,.15); color: var(--warn); }
    .score { font-variant-numeric: tabular-nums; font-weight: 700; }
    .kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin-top: 8px; font-size: 13px; }
    .kv dt { color: var(--muted); }
    .kv dd { margin: 0; font-variant-numeric: tabular-nums; }
    .amount { font-weight: 600; }
    .meta { color: var(--muted); font-size: 12px; margin-top: 6px; }
    .empty, .err { text-align: center; color: var(--muted); padding: 24px; }
    .err { color: var(--bad); }
    .note { font-size: 12px; color: var(--muted); margin-top: 10px; }
  </style>
</head>
<body>
  <header>
    <h1>Review de Risco · LetzTech</h1>
    <div class="sub">Avaliações de fraude — PII sempre mascarada</div>
  </header>
  <main>
    <div class="card" id="auth-card">
      <label for="token">Admin API Key (Bearer)</label>
      <input id="token" type="password" placeholder="cole seu ADMIN_API_KEY" autocomplete="off" />
      <p class="note">Guardado só nesta aba (sessionStorage) e enviado como <code>Authorization: Bearer</code>.
        Não é persistido; fecha a aba e some.</p>
    </div>

    <div class="card">
      <label for="mode">Modo</label>
      <select id="mode">
        <option value="attempts">Tentativas recusadas (card testing)</option>
        <option value="evaluations">Avaliações de risco (Koin)</option>
      </select>
      <p class="note" id="mode-note"></p>
    </div>

    <div class="card" id="filters-attempts">
      <div class="row">
        <div>
          <label for="a_min_refused">Mín. recusas</label>
          <input id="a_min_refused" type="number" inputmode="numeric" value="2" />
        </div>
        <div>
          <label for="a_window">Janela</label>
          <select id="a_window">
            <option value="1">última 1h</option>
            <option value="6">últimas 6h</option>
            <option value="24" selected>últimas 24h</option>
            <option value="168">últimos 7 dias</option>
          </select>
        </div>
      </div>
      <div class="row">
        <div>
          <label for="a_method">Método</label>
          <select id="a_method">
            <option value="credit_card" selected>credit_card</option>
            <option value="">todos</option>
            <option value="pix">pix</option>
            <option value="boleto">boleto</option>
          </select>
        </div>
        <div>
          <label for="a_store_id">Store ID</label>
          <input id="a_store_id" type="text" placeholder="opcional" autocomplete="off" />
        </div>
      </div>
      <button id="search-attempts">Buscar tentativas</button>
    </div>

    <div class="card" id="filters-evaluations" hidden>
      <div class="row">
        <div>
          <label for="status">Status</label>
          <select id="status">
            <option value="">todos</option>
            <option value="denied">denied</option>
            <option value="approved">approved</option>
            <option value="received">received</option>
          </select>
        </div>
        <div>
          <label for="min_score">Score mínimo</label>
          <input id="min_score" type="number" inputmode="numeric" placeholder="ex: 70" />
        </div>
      </div>
      <div class="row">
        <div>
          <label for="store_id">Store ID</label>
          <input id="store_id" type="text" placeholder="opcional" autocomplete="off" />
        </div>
        <div>
          <label for="limit">Limite</label>
          <input id="limit" type="number" inputmode="numeric" value="20" />
        </div>
      </div>
      <div class="row">
        <div>
          <label for="from">De</label>
          <input id="from" type="datetime-local" />
        </div>
        <div>
          <label for="to">Até</label>
          <input id="to" type="datetime-local" />
        </div>
      </div>
      <button id="search">Buscar avaliações</button>
    </div>

    <div id="results"></div>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const TOKEN_KEY = 'letztech.admin.token';

    // Restore token for this tab only.
    $('token').value = sessionStorage.getItem(TOKEN_KEY) || '';

    const fmtAmount = (cents, currency) => {
      try {
        return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: currency || 'BRL' }).format((cents || 0) / 100);
      } catch { return ((cents || 0) / 100).toFixed(2) + ' ' + (currency || ''); }
    };
    const fmtDate = (iso) => iso ? new Date(iso).toLocaleString('pt-BR') : '—';
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    const toIso = (localValue) => localValue ? new Date(localValue).toISOString() : '';

    async function search() {
      const token = $('token').value.trim();
      if (!token) { render(`<div class="err">Informe o Admin API Key.</div>`); return; }
      sessionStorage.setItem(TOKEN_KEY, token);

      const params = new URLSearchParams();
      const status = $('status').value; if (status) params.set('status', status);
      const minScore = $('min_score').value; if (minScore) params.set('min_score', minScore);
      const storeId = $('store_id').value.trim(); if (storeId) params.set('store_id', storeId);
      const limit = $('limit').value; if (limit) params.set('limit', limit);
      const from = toIso($('from').value); if (from) params.set('from', from);
      const to = toIso($('to').value); if (to) params.set('to', to);

      render(`<div class="empty">Buscando…</div>`);
      try {
        const res = await fetch('/v1/risk/evaluations?' + params.toString(), {
          headers: { Authorization: 'Bearer ' + token },
        });
        if (res.status === 401) { render(`<div class="err">Não autorizado — verifique o Admin API Key.</div>`); return; }
        if (!res.ok) { render(`<div class="err">Erro ${res.status} ao buscar.</div>`); return; }
        const body = await res.json();
        renderList(body);
      } catch (e) {
        render(`<div class="err">Falha de rede: ${esc(e.message)}</div>`);
      }
    }

    function renderList(body) {
      const items = (body && body.data) || [];
      if (!items.length) { render(`<div class="empty">Nenhuma avaliação encontrada.</div>`); return; }
      const header = `<div class="meta">${body.total} avaliação(ões) — mostrando ${items.length}</div>`;
      const html = items.map((e) => {
        const c = e.customer || {};
        const st = (e.status || '').toLowerCase();
        return `
        <div class="eval">
          <div class="top">
            <div><strong>${esc(e.provider)}</strong> · <span class="badge ${esc(st)}">${esc(e.status)}</span></div>
            <div class="score">score ${e.score ?? '—'}</div>
          </div>
          <div class="meta">${esc(e.type)} · ${fmtDate(e.createdAt)}</div>
          <dl class="kv">
            <dt>Valor</dt><dd class="amount">${fmtAmount(e.payment?.amount, e.payment?.currency)}</dd>
            <dt>Método</dt><dd>${esc(e.payment?.method)} · ${esc(e.payment?.status)}</dd>
            <dt>Ref</dt><dd>${esc(e.payment?.externalRef)}</dd>
            <dt>Cliente</dt><dd>${esc(c.name)}</dd>
            <dt>Documento</dt><dd>${esc(c.document)}</dd>
            <dt>E-mail</dt><dd>${esc(c.email)}</dd>
            <dt>Telefone</dt><dd>${esc(c.phone)}</dd>
            <dt>IP</dt><dd>${esc(c.ip)}</dd>
            <dt>Payment</dt><dd>${esc(e.paymentId)}</dd>
          </dl>
        </div>`;
      }).join('');
      render(header + html);
    }

    function render(html) { $('results').innerHTML = html; }
    $('search').addEventListener('click', search);

    // --- Declined attempts (card testing) ---

    const MODE_NOTES = {
      attempts: 'Agrupa tentativas de cobrança por documento do cliente, lendo de payments. '
        + 'Muitas tentativas com alta taxa de recusa, valores baixos e variados numa janela curta '
        + 'é a assinatura de alguém testando cartões roubados.',
      evaluations: 'Avaliações da Koin. Só há dados aqui para lojas com fraudEnabled=true — '
        + 'lojas provisionadas automaticamente pelo WooCommerce nascem com a análise desligada.',
    };

    function applyMode() {
      const mode = $('mode').value;
      $('filters-attempts').hidden = mode !== 'attempts';
      $('filters-evaluations').hidden = mode !== 'evaluations';
      $('mode-note').textContent = MODE_NOTES[mode];
      render('');
    }
    $('mode').addEventListener('change', applyMode);
    applyMode();

    async function searchAttempts() {
      const token = $('token').value.trim();
      if (!token) { render(`<div class="err">Informe o Admin API Key.</div>`); return; }
      sessionStorage.setItem(TOKEN_KEY, token);

      const params = new URLSearchParams();
      const minRefused = $('a_min_refused').value; if (minRefused) params.set('min_refused', minRefused);
      const method = $('a_method').value; if (method) params.set('method', method);
      const storeId = $('a_store_id').value.trim(); if (storeId) params.set('store_id', storeId);
      const hours = parseInt($('a_window').value, 10);
      params.set('since', new Date(Date.now() - hours * 3600 * 1000).toISOString());

      render(`<div class="empty">Buscando…</div>`);
      try {
        const res = await fetch('/v1/risk/declined-attempts?' + params.toString(), {
          headers: { Authorization: 'Bearer ' + token },
        });
        if (res.status === 401) { render(`<div class="err">Não autorizado — verifique o Admin API Key.</div>`); return; }
        if (!res.ok) { render(`<div class="err">Erro ${res.status} ao buscar.</div>`); return; }
        renderAttempts(await res.json());
      } catch (e) {
        render(`<div class="err">Falha de rede: ${esc(e.message)}</div>`);
      }
    }

    function renderAttempts(body) {
      const items = (body && body.data) || [];
      if (!items.length) {
        render(`<div class="empty">Nenhum agrupamento acima do limiar nesta janela.</div>`);
        return;
      }
      const header = `<div class="meta">${items.length} documento(s) com recusas repetidas</div>`;
      const html = items.map((c) => {
        // Many small, varied amounts in a short window is the strongest tell.
        const suspicious = c.refusalRate >= 70 && c.attempts >= 5;
        return `
        <div class="eval">
          <div class="top">
            <div><strong>${esc(c.document)}</strong>
              <span class="badge ${suspicious ? 'denied' : 'received'}">${c.refusalRate}% recusa</span>
            </div>
            <div class="score">${c.refused}/${c.attempts}</div>
          </div>
          <div class="meta">${esc(c.name)} · ${esc(c.email)}</div>
          <dl class="kv">
            <dt>Tentativas</dt><dd>${c.attempts} (${c.refused} recusadas)</dd>
            <dt>Valores</dt><dd>${fmtAmount(c.minAmount, 'BRL')} – ${fmtAmount(c.maxAmount, 'BRL')} · ${c.distinctAmounts} distinto(s)</dd>
            <dt>Janela</dt><dd>${c.spanMinutes} min</dd>
            <dt>Primeira</dt><dd>${fmtDate(c.firstAt)}</dd>
            <dt>Última</dt><dd>${fmtDate(c.lastAt)}</dd>
            <dt>Payments</dt><dd>${(c.samplePaymentIds || []).map(esc).join('<br>')}</dd>
          </dl>
        </div>`;
      }).join('');
      render(header + html);
    }

    $('search-attempts').addEventListener('click', searchAttempts);
  </script>
</body>
</html>
